<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Like Button by Andrii Kycha</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button id="like" class="like-button">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="48"
        height="48"
        viewBox="-12 -12 48 48"
        fill="currentColor"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        data-lucide="heart"
        class="lucide lucide-heart like-icon"
      >
        <path
          d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"
        ></path>

        <circle
          cx="12"
          cy="12"
          r="0"
          stroke-width="0"
          stroke="transparent"
          fill="none"
        ></circle>
      </svg>
      <i data-lucide="heart" class="like-icon"></i>
      <!-- <span class="like-ripple"></span> -->
    </button>

    <script src="index.js"></script>
  </body>
</html>
