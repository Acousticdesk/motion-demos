<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetic Scroll Demo by Andrii Kycha</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="hero">
        <div>
          <h1 class="no-offset hero-text">You can scroll</h1>
          <p>Really, just give it a try...</p>
        </div>
      </section>

      <section class="list-container">
        <p class="list-text">You can</p>

        <ul class="list">
          <li style="--i: 0">clone.</li>
          <li style="--i: 1">branch.</li>
          <li style="--i: 2">commit.</li>
          <li style="--i: 3">push.</li>
          <li style="--i: 4">break.</li>
          <li style="--i: 5">learn.</li>
          <li style="--i: 6">debug.</li>
          <li style="--i: 7">refactor.</li>
          <li style="--i: 8">optimize.</li>
          <li style="--i: 9">deploy.</li>
          <li style="--i: 10">monitor.</li>
          <li style="--i: 11">scale.</li>
          <li style="--i: 12">solve.</li>
          <li style="--i: 13">sleep.</li>
          <li style="--i: 14">repeat.</li>
        </ul>
      </section>

      <section class="hero">
        <div>
          <h1 class="no-offset hero-text">Done.</h1>
          <h1 class="no-offset hero-text">Merge.</h1>
        </div>
      </section>
    </main>

    <footer class="container">
      <p>
        Kinetic Scroll Demo by
        <a
          href="https://www.linkedin.com/in/akicha/"
          target="_blank"
          rel="noopener"
          >Andrii Kycha</a
        >
      </p>
    </footer>

    <script src="index.js"></script>
  </body>
</html>
